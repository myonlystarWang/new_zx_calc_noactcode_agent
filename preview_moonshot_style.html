<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天书万象 AI · Moonshot 风格月相浑天视觉概念页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
    
    * {
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #05080f;
      color: #e2e8f0;
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }
    .font-serif-sc {
      font-family: 'Noto Serif SC', serif;
    }

    /* 宇宙深空背景：纯正黑曜墨夜与暗蓝星云 (100% 不透明纯深色，根除浏览器默认白底透光) */
    .cosmic-bg {
      background-color: #05080f;
      background-image: radial-gradient(circle at 50% 38%, #0b1325 0%, #070d19 45%, #05080f 85%);
    }

    /* 浑天月环幽微呼吸感 (纯净微光脉动，不叠加重度 drop-shadow 滤镜避免曝光失真) */
    @keyframes celestial-pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.8;
      }
    }
    .celestial-glow {
      animation: celestial-pulse 6s ease-in-out infinite;
    }

    /* 浑天八卦同心圆逆行旋转 */
    @keyframes orbit-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbit-ccw {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    /* 外部外层：高亮纯白日蚀光弧 逆时针公转 (22s 慢巡弋) */
    .orbit-outer-white {
      animation: orbit-ccw 22s linear infinite;
      transform-origin: center;
    }
    /* 外部内层：玄青渐变次弧 逆时针公转 (14s 快巡弋，产生内外双星追逐视差) */
    .orbit-inner-cyan {
      animation: orbit-ccw 14s linear infinite;
      transform-origin: center;
    }
    .orbit-slow-ccw {
      animation: orbit-ccw 26s linear infinite;
      transform-origin: center;
    }

    /* 内部核心太极天书星轮整体顺时针自转 */
    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-cw 18s linear infinite;
      transform-origin: center;
    }

    /* 内部微动效 1：神经网络量子数据脉冲流动 */
    @keyframes data-stream {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -24; }
    }
    .animate-data-stream {
      animation: data-stream 1.6s linear infinite;
    }

    /* 内部微动效 2：神经元突触光斑交错呼吸 */
    @keyframes node-breathe-1 {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes node-breathe-2 {
      0%, 100% { transform: scale(1.3); opacity: 1; }
      50% { transform: scale(1); opacity: 0.7; }
    }
    .animate-node-pulse-1 {
      animation: node-breathe-1 2.2s ease-in-out infinite;
      transform-origin: 50px 50px;
    }
    .animate-node-pulse-2 {
      animation: node-breathe-2 2.2s ease-in-out infinite;
      transform-origin: 50px 50px;
    }

    /* 内部微动效 3：中央全知天目星芒脉冲聚光 */
    @keyframes eye-beacon {
      0%, 100% { transform: scale(0.92); opacity: 0.8; filter: drop-shadow(0 0 2px rgba(34, 211, 238, 0.6)); }
      50% { transform: scale(1.28); opacity: 1; filter: drop-shadow(0 0 7px rgba(34, 211, 238, 0.95)) drop-shadow(0 0 12px rgba(251, 191, 36, 0.6)); }
    }
    .animate-eye-beacon {
      animation: eye-beacon 2.4s ease-in-out infinite;
      transform-origin: 50px 50px;
    }

    /* 内部微动效 4：天书竹简简牍明暗律动 */
    @keyframes slips-lum {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }
    .animate-slips-lum {
      animation: slips-lum 3.6s ease-in-out infinite;
    }

    /* 内部微动效 5：太极双鱼玄气流水微光起伏 */
    @keyframes taiji-lum {
      0%, 100% { opacity: 0.75; stroke-width: 1.4; }
      50% { opacity: 1; stroke-width: 1.9; }
    }
    .animate-taiji-lum {
      animation: taiji-lum 4s ease-in-out infinite;
    }

    /* 极光流光文字渐变 */
    .aurora-text {
      background: linear-gradient(135deg, #a5f3fc 0%, #ffffff 40%, #fde68a 85%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 自定义轻量滚动条 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

  <!-- 2. 中间核心视觉区：留足震撼的“天书浑天月相神环”空间 -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 relative z-10 -mt-2">
    <div class="w-full max-w-4xl flex flex-col items-center text-center">

      <!-- 浑天月环宇宙视觉图腾 (模拟 Moonshot 月相日冕 + 诛仙太极量子浑天仪) -->
      <div id="celestialStage" class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center cursor-pointer mb-3 select-none transition-transform duration-300 hover:scale-105">
        <!-- 外部极光色散日冕光晕 (幽邃深空微光) -->
        <div class="absolute -inset-4 rounded-full bg-gradient-to-tr from-cyan-500/20 via-indigo-600/15 to-amber-400/10 blur-xl celestial-glow pointer-events-none"></div>

        <!-- 外部外层：日全食贝利珠纯白流光弧 (r=88，外层巡弋，22s 逆转) -->
        <svg class="absolute inset-0 w-full h-full orbit-outer-white pointer-events-none" viewBox="0 0 200 200" fill="none">
          <defs>
            <filter id="beadGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>
          <!-- 外层纯白光弧 (长约 110 度) -->
          <circle cx="100" cy="100" r="88" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="110 440" opacity="0.95"/>
          <!-- 贝利珠耀斑聚光星点 -->
          <circle cx="100" cy="12" r="2.6" fill="#ffffff" filter="url(#beadGlow)"/>
        </svg>

        <!-- 外部内层：玄青至浅金日冕渐变弧 (r=78，内层快巡弋，14s 逆转，与外层隔离 10px 形成双星追逐) -->
        <svg class="absolute inset-0 w-full h-full orbit-inner-cyan pointer-events-none" viewBox="0 0 200 200" fill="none">
          <defs>
            <linearGradient id="innerEclipseRim" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
              <stop offset="45%" stop-color="#818cf8" stop-opacity="0.75" />
              <stop offset="85%" stop-color="#fbbf24" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
            </linearGradient>
            <filter id="innerCoronaBlur">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>
          <!-- 内层柔光渐变长弧 (长约 150 度) -->
          <circle cx="100" cy="100" r="78" stroke="url(#innerEclipseRim)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="150 340" filter="url(#innerCoronaBlur)"/>
        </svg>

        <!-- 逆向旋转的八卦星轨金环 (26s 逆转) -->
        <div class="absolute inset-2.5 rounded-full border border-amber-400/25 border-dashed orbit-slow-ccw pointer-events-none"></div>
        <!-- 逆向旋转的青灵星轨点环 (26s 逆转) -->
        <div class="absolute inset-6 rounded-full border border-cyan-400/20 orbit-slow-ccw pointer-events-none" style="border-style: dotted;"></div>

        <!-- 浑天球本体：深邃墨色球体 + 核心八卦神经元全息投影 -->
        <div class="relative w-40 h-40 sm:w-44 sm:h-44 rounded-full bg-[#070b14] border border-cyan-500/40 shadow-[inset_0_0_30px_rgba(34,211,238,0.25)] flex items-center justify-center overflow-hidden">
          <!-- 内部量子扫描光栅线 -->
          <div class="absolute inset-0 bg-[linear-gradient(to_bottom,transparent_50%,rgba(6,182,212,0.08)_51%)] bg-[length:100%_4px] pointer-events-none"></div>

          <!-- 正式天书万象 AI 完整 Logo (高精矢量八卦神经元太极印) -->

            class="w-36 h-36 sm:w-40 sm:h-40 animate-spin-slow drop-shadow-[0_0_24px_rgba(34,211,238,0.35)]"
            viewBox="0 0 100 100"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="天书万象 AI 核心图腾"

            <defs>
              <!-- 背景渐变 -->

                <stop offset="60%" stop-color="#0b0f17" />
                <stop offset="100%" stop-color="#070a10" />

                <stop offset="50%" stop-color="#22d3ee" />

                <stop offset="50%" stop-color="#fbbf24" />

              <!-- 混合光晕 -->

                <stop offset="0%" stop-color="#22d3ee" />
                <stop offset="50%" stop-color="#818cf8" />
                <stop offset="100%" stop-color="#fbbf24" />
              </linearGradient>

              <!-- 辉光滤镜 -->
              <filter id="ctr_tsGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <!-- 底盘微光圆 -->
            <circle cx="50" cy="50" r="48" fill="url(#ctr_tsBgGrad)" stroke="#1e293b" stroke-width="1" />

            <!-- 外圈：八卦太极道印能量星轨 (随整体顺时针自转) -->
            <circle

            <circle

            <line x1="81.11" y1="81.11" x2="83.23" y2="83.23" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
            <line x1="50" y1="94" x2="50" y2="97" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
            <line x1="18.89" y1="81.11" x2="16.77" y2="83.23" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

            <line x1="81.11" y1="18.89" x2="83.23" y2="16.77" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

            <!-- 太极双鱼玄气流水 -->
            <path
              d="M 50 18 A 16 16 0 0 1 50 50 A 16 16 0 0 0 50 82 A 32 32 0 0 1 50 18 Z"
              fill="url(#ctr_tsCyanGrad)"
              opacity="0.14"
            />
            <path
              class="animate-taiji-lum"
              d="M 50 18 A 16 16 0 0 1 50 50 A 16 16 0 0 0 50 82"
              stroke="url(#ctr_tsCyanGrad)"
              stroke-width="1.5"
              stroke-linecap="round"
              fill="none"
              filter="url(#ctr_tsGlow)"
              opacity="0.85"
            />

            <!-- 核心内芯：天书竹简几何光束展开与神经网络交织 (简牍柔和明暗呼吸) -->
            <g class="animate-slips-lum">
              <rect x="36" y="27" width="4" height="46" rx="2" fill="url(#ctr_tsCyanGrad)" opacity="0.35" />
              <rect x="44" y="23" width="4" height="54" rx="2" fill="url(#ctr_tsDualGrad)" opacity="0.75" />
              <rect x="52" y="23" width="4" height="54" rx="2" fill="url(#ctr_tsDualGrad)" opacity="0.75" />
              <rect x="60" y="27" width="4" height="46" rx="2" fill="url(#ctr_tsGoldGrad)" opacity="0.35" />
            </g>

            <!-- 神经网络节点互联连线 -->
            <path

  <!-- 交互脚本与星空渲染 -->
  <script>
    // 1. 浑天月相星空粒子模拟
    const canvas = document.getElementById('cosmicCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    const stars = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.5 + 0.3,
        alpha: Math.random() * 0.8 + 0.2,
        speed: Math.random() * 0.02 + 0.005
      });
    }

    function renderStars() {
      ctx.clearRect(0, 0, width, height);
      for (const s of stars) {
        s.alpha += Math.sin(Date.now() * s.speed) * 0.01;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, s.alpha))})`;
        ctx.fill();
      }
      requestAnimationFrame(renderStars);
    }
    renderStars();

    // 2. 浑天神球 3D 鼠标微倾角视差交互
    const stage = document.getElementById('celestialStage');
    window.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight * 0.38;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;
      stage.style.transform = `rotateY(${dx * 12}deg) rotateX(${-dy * 12}deg)`;
    });

    // 3. + 号菜单展开/收起切换
    const plusBtn = document.getElementById('plusBtn');
    const plusMenu = document.getElementById('plusMenu');
    const plusIcon = document.getElementById('plusIcon');
    const closeIcon = document.getElementById('closeIcon');

    plusBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = !plusMenu.classList.contains('hidden');
      if (isOpen) {
        plusMenu.classList.add('hidden');
        plusIcon.classList.remove('hidden');
        closeIcon.classList.add('hidden');
        plusBtn.classList.remove('text-cyan-300');
        plusBtn.classList.add('text-slate-400');
      } else {
        plusMenu.classList.remove('hidden');
        plusIcon.classList.add('hidden');
        closeIcon.classList.remove('hidden');
        plusBtn.classList.add('text-cyan-300');
        plusBtn.classList.remove('text-slate-400');
      }
    });

    document.addEventListener('click', (e) => {
      if (!plusMenu.contains(e.target) && !plusBtn.contains(e.target)) {
        plusMenu.classList.add('hidden');
        plusIcon.classList.remove('hidden');
        closeIcon.classList.add('hidden');
        plusBtn.classList.remove('text-cyan-300');
        plusBtn.classList.add('text-slate-400');
      }
    });

    // 4. 药丸点击填入输入框
    document.querySelectorAll('.pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const text = btn.innerText.trim();
        document.getElementById('chatInput').value = text;
        document.getElementById('chatInput').focus();
      });
    });
  </script>
